[project]
name = "viseditbench"
version = "0.1.0"
description = "Reproducible diagram editing and evaluation with visual instructions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.95,<1",
  "google-genai>=1.73.1,<2",
  "huggingface-hub>=0.34,<2",
  "openai>=2.31,<3",
  "pillow>=11,<13",
  "pydantic>=2.13,<3",
  "python-dotenv>=1.2,<2",
  "requests>=2.32,<3",
  "tqdm>=4.67,<5",
]

[project.optional-dependencies]
diffusers = ["torch>=2.6", "diffusers>=0.35", "transformers>=4.51", "accelerate>=1"]
analysis = ["numpy>=1.26", "scipy>=1.12", "matplotlib>=3.8"]

[project.scripts]
viseditbench-data = "viseditbench.data:main"
viseditbench-results = "viseditbench.results:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["viseditbench"]

[tool.ruff.lint]
extend-select = ["I"]
